version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: aaspaas-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aaspaas_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aaspaas-prod-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aaspaas-backend-prod
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aaspaas_prod}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - RUN_MIGRATIONS=true
      - SEED_ON_STARTUP=${SEED_ON_STARTUP:-false}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--proxy-headers"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aaspaas-prod-network

volumes:
  postgres_prod_data:

networks:
  aaspaas-prod-network:
    driver: bridge
