version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: aaspaas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aaspaas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aaspaas-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aaspaas-backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aaspaas_dev
      - JWT_SECRET=dev_jwt_secret_key_change_in_production_min_32_chars!
      - JWT_REFRESH_SECRET=dev_jwt_refresh_secret_key_change_in_prod_32!
      - RUN_MIGRATIONS=true
      - SEED_ON_STARTUP=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aaspaas-network

  postgres_test:
    image: postgis/postgis:15-3.4
    container_name: aaspaas-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aaspaas_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aaspaas-network

volumes:
  postgres_data:
  postgres_test_data:

networks:
  aaspaas-network:
    driver: bridge