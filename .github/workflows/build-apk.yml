name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./mobile
        run: |
          flutter analyze > ../analyze.txt 2>&1 || true
          cat ../analyze.txt

      - name: Report Diagnostics to Commit Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let content = '';
            try {
              content = fs.readFileSync('analyze.txt', 'utf8');
            } catch (e) {
              content = 'Could not read analyze.txt: ' + e;
            }
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Flutter Analyze Diagnostics:\n```\n' + content.slice(0, 50000) + '\n```'
            });

      - name: Verify No Analyze Errors
        run: |
          if grep -q "error •" analyze.txt; then
            echo "Analyze found errors!"
            exit 1
          fi

      - name: Build Release APK
        working-directory: ./mobile
        run: |
          flutter build apk --release

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAS-PAAS-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
